name: Test Clang Problem Matcher

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
env:
  NO_COLOR: 1

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Setup problem matcher
      run: |
        echo "::add-matcher::.github/clang-problem-matcher.json"

    - name: Show Problem
      run: |
        cat clang-error.txt 1>&2

    #- name: Install Clang
    #  run: |
    #    sudo apt-get update
    #    sudo apt-get install -y clang
    #
    #- name: Compile with Clang (this will fail)
    #  run: |
    #    clang++ -Wall -Werror -std=c++17 src/test.cpp -o test
    #  continue-on-error: true

    - name: Remove problem matcher
      run: |
        echo "::remove-matcher owner=clang::"

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 'test python annotations'
      run: |
        python3.12 ./github.py
